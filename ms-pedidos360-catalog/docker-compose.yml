# docker-compose.yml
services:
  catalog-db:
    image: postgres:16
    container_name: pedidos360-catalog-db
    environment:
      POSTGRES_DB: pedidos360_catalog
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360_dev
    ports:
      - "5434:5432"   # puerto distinto a orders para no chocar si corres ambos a la vez
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data

volumes:
  catalog_pgdata: