server:
  port: ${PORT:8088}   # distinto al de orders (8087)

spring:
  application:
    name: ms-pedidos360-catalog

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:pedidos360_catalog}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:pedidos360}
    password: ${DB_PASSWORD:pedidos360_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true